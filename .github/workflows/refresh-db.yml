name: Refresh legal DB (staged)

# Auto-refresh the RAG legal database every 24h. The job SCRAPES sources and
# STAGES candidate changes into lib/ragDatabase.js `pending_updates`, then opens a
# PR for human review. It never auto-merges changes into the verified rules.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run refresh (stage candidates)
        env:
          # AI key: Gemini → Groq → OpenAI (see lib/llm.js). Set whichever you use
          # as repo secrets (GEMINI_API_KEYS, GROQ_API_KEYS, OPENAI_API_KEYS).
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
          INDIAN_KANOON_TOKEN: ${{ secrets.INDIAN_KANOON_TOKEN }}
        run: npm run refresh-db
      - name: Open PR if the DB changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(db): staged legal-DB refresh candidates (${{ github.run_id }})"
          branch: db-refresh/staged
          title: "DB refresh candidates"
          body: |
            Automated nightly scrape staged new candidate changes into
            `lib/ragDatabase.js` → `pending_updates`.

            **Review before merging.** Verified `eligibility_rules` / `stamp_duty`
            are untouched; a human should confirm each candidate against the cited
            source and promote it into the verified rules if correct.
          add-paths: |
            lib/ragDatabase.js
